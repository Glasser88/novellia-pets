services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: novellia
      POSTGRES_PASSWORD: novellia
      POSTGRES_DB: novellia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novellia -d novellia"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The app in a container. For day-to-day development run only `db` here and
  # the app on the host with `make dev`; this service is the one-command demo.
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Inside the Compose network the database is reached by service name.
      DATABASE_URL: postgresql://novellia:novellia@db:5432/novellia
      # Containers default to UTC; "today" must be judged in the owner's zone.
      TZ: ${TZ:-America/Edmonton}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
